[versions]
annotations = "26.0.2"
binaryCompatibilityValidator = "0.18.1"
coroutines = "1.10.2"
kotlin = "2.1.21"
ktor = "3.2.3"
sonatypeMavenCentral = "1.0.0"

[plugins]
g000sha256-sonatypeMavenCentral = { id = "dev.g000sha256.sonatype-maven-central", version.ref = "sonatypeMavenCentral" }
gradle-javaGradlePlugin = { id = "org.gradle.java-gradle-plugin" }
gradle-mavenPublish = { id = "org.gradle.maven-publish" }
gradle-signing = { id = "org.gradle.signing" }
jetBrains-binaryCompatibilityValidator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binaryCompatibilityValidator" }
jetBrains-kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[libraries]
libs-jetBrains-annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
libs-jetBrains-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
libs-jetBrains-kotlin = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
libs-ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
libs-ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
libs-ktor-http = { module = "io.ktor:ktor-http", version.ref = "ktor" }
libs-ktor-io = { module = "io.ktor:ktor-io", version.ref = "ktor" }
libs-ktor-utils = { module = "io.ktor:ktor-utils", version.ref = "ktor" }
